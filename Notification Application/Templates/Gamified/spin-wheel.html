<div class="spin-wheel-container" style="max-width: 440px; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); position: relative; text-align: center;">
    <button class="close-btn" style="position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 24px; cursor: pointer; color: #94a3b8;">&times;</button>
    
    <h2 style="font-size: 28px; font-weight: 800; color: #1e293b; margin: 0 0 8px 0;">🎰 Spin to Win!</h2>
    <p style="font-size: 16px; color: #64748b; margin: 0 0 28px 0;">Try your luck and win exclusive prizes</p>
    
    <div class="wheel-wrapper" style="position: relative; width: 260px; height: 260px; margin: 0 auto 28px;">
        <div class="wheel" style="width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(
            #ef4444 0deg 45deg,
            #f97316 45deg 90deg,
            #eab308 90deg 135deg,
            #22c55e 135deg 180deg,
            #3b82f6 180deg 225deg,
            #8b5cf6 225deg 270deg,
            #ec4899 270deg 315deg,
            #6366f1 315deg 360deg
        ); display: flex; align-items: center; justify-content: center; transition: transform 4s ease-out; box-shadow: 0 0 0 8px #1e293b, 0 8px 24px rgba(0,0,0,0.2);">
            <div style="width: 60px; height: 60px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
                <span style="font-size: 24px;">🎯</span>
            </div>
        </div>
        <div class="wheel-pointer" style="position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #1e293b;"></div>
    </div>
    
    <form class="spin-form">
        <input type="email" name="email" placeholder="Enter your email to spin" style="width: 100%; padding: 16px 20px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; margin-bottom: 16px; transition: all 0.2s;" required>
        <button type="submit" class="spin-btn" style="width: 100%; padding: 18px; background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: 800; cursor: pointer; transition: all 0.2s;">🎲 SPIN THE WHEEL</button>
    </form>
    
    <div style="display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap;">
        <span style="font-size: 12px; color: #64748b; background: #f1f5f9; padding: 4px 12px; border-radius: 20px;">10% OFF</span>
        <span style="font-size: 12px; color: #64748b; background: #f1f5f9; padding: 4px 12px; border-radius: 20px;">Free Shipping</span>
        <span style="font-size: 12px; color: #64748b; background: #f1f5f9; padding: 4px 12px; border-radius: 20px;">$5 Credit</span>
        <span style="font-size: 12px; color: #64748b; background: #f1f5f9; padding: 4px 12px; border-radius: 20px;">25% OFF</span>
    </div>
</div>

<style>
.spin-wheel-container {
    animation: popIn 0.4s ease-out;
}

@keyframes popIn {
    from {
        opacity: 0;
        transform: scale(0.9);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.spin-form input:focus {
    outline: none;
    border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
}

.spin-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
}

.wheel.spinning {
    transform: rotate(1800deg);
}

.close-btn:hover {
    color: #64748b;
}
</style>
