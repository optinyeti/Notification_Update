<div style="max-width: 650px; margin: 0 auto; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.2); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0;">
        <div style="background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%); padding: 40px; color: white; display: flex; flex-direction: column; justify-content: center;">
            <div style="font-size: 48px; margin-bottom: 16px;">❄️</div>
            <h2 style="font-size: 32px; font-weight: 800; margin: 0 0 12px 0; line-height: 1.2;">Beat the Heat!</h2>
            <p style="font-size: 16px; margin: 0 0 24px 0; opacity: 0.95; line-height: 1.6;">Keep your home cool & comfortable all summer long</p>
            <div style="background: rgba(255,255,255,0.15); padding: 16px; border-radius: 12px; border-left: 4px solid white;">
                <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px;">✓ 20% OFF AC Tune-Up</div>
                <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px;">✓ Free System Inspection</div>
                <div style="font-size: 14px; font-weight: 600;">✓ Same-Day Service</div>
            </div>
        </div>
        <div style="padding: 40px; background: #f9fafb;">
            <h3 style="font-size: 24px; font-weight: 700; color: #111827; margin: 0 0 8px 0;">Schedule Your Service</h3>
            <p style="font-size: 14px; color: #6b7280; margin: 0 0 24px 0;">Limited time offer - Act now!</p>
            <form>
                <input type="text" placeholder="Full Name" required style="width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 15px; margin-bottom: 12px; box-sizing: border-box;">
                <input type="tel" placeholder="Phone" required style="width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 15px; margin-bottom: 12px; box-sizing: border-box;">
                <input type="email" placeholder="Email" required style="width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 15px; margin-bottom: 12px; box-sizing: border-box;">
                <select style="width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 15px; margin-bottom: 16px; box-sizing: border-box;">
                    <option>Select Service</option>
                    <option>AC Repair</option>
                    <option>AC Installation</option>
                    <option>Heating Repair</option>
                    <option>Maintenance Plan</option>
                </select>
                <button type="submit" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;">Claim 20% OFF</button>
            </form>
            <p style="font-size: 12px; color: #9ca3af; text-align: center; margin: 12px 0 0 0;">🕒 Average response time: 2 hours</p>
        </div>
    </div>
</div>
