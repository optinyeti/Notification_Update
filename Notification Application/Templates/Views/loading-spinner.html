            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: linear-gradient(135deg, #3b82f6, #2563eb); border-radius: 50%; display: flex; align-items: center; justify-content: center;">

<style>
.loading-view {
    position: relative;
    animation: fadeIn 0.3s ease-out;

        opacity: 1;
    }
}
