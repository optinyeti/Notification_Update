<div style="max-width: 600px; margin: 0 auto; background: #f8fafc; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.15); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <div style="padding: 40px; text-align: center;">
        <div style="background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); border-radius: 50%; width: 100px; height: 100px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 24px; box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);">
            <span style="font-size: 56px;">📋</span>
        </div>
        
        <h2 style="font-size: 36px; font-weight: 900; color: #111827; margin: 0 0 12px 0;">Quick Survey</h2>
        <p style="font-size: 16px; color: #6b7280; margin: 0 0 32px 0; line-height: 1.6;">Help us improve! Share your thoughts in 30 seconds.</p>

        <div style="background: white; border-radius: 12px; padding: 28px; margin-bottom: 24px; text-align: left;">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 700; color: #111827; font-size: 14px; margin-bottom: 10px;">How satisfied are you with our service?</label>
                <div style="display: flex; justify-content: space-between; gap: 8px;">
                    <button type="button" style="flex: 1; padding: 12px; background: #fef3c7; border: 2px solid #fbbf24; border-radius: 8px; font-size: 24px; cursor: pointer; transition: transform 0.2s;">😞</button>
                    <button type="button" style="flex: 1; padding: 12px; background: #fef3c7; border: 2px solid #fbbf24; border-radius: 8px; font-size: 24px; cursor: pointer; transition: transform 0.2s;">😐</button>
                    <button type="button" style="flex: 1; padding: 12px; background: #fef3c7; border: 2px solid #fbbf24; border-radius: 8px; font-size: 24px; cursor: pointer; transition: transform 0.2s;">🙂</button>
                    <button type="button" style="flex: 1; padding: 12px; background: #fef3c7; border: 2px solid #fbbf24; border-radius: 8px; font-size: 24px; cursor: pointer; transition: transform 0.2s;">😃</button>
                    <button type="button" style="flex: 1; padding: 12px; background: #fef3c7; border: 2px solid #fbbf24; border-radius: 8px; font-size: 24px; cursor: pointer; transition: transform 0.2s;">🤩</button>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 700; color: #111827; font-size: 14px; margin-bottom: 10px;">What can we improve?</label>
                <textarea rows="4" placeholder="Your feedback..." style="width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 14px; box-sizing: border-box; resize: vertical; font-family: inherit;"></textarea>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 700; color: #111827; font-size: 14px; margin-bottom: 10px;">Your Email (optional)</label>
                <input type="email" placeholder="email@example.com" style="width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 14px; box-sizing: border-box;">
            </div>
        </div>

        <button type="submit" style="width: 100%; padding: 16px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);">Submit Feedback</button>
        
        <p style="font-size: 12px; color: #9ca3af; margin: 16px 0 0 0;">Your feedback helps us serve you better 💙</p>
    </div>
</div>
